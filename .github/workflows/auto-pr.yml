name: Create Cluster PR

on:
  push:
    branches:
      - cluster-staging
    paths:
      - "clusters/**"

concurrency:
  group: cluster-staging-pr
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create-pr:
    name: Create or Update Cluster PR
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # Configure Git
      # ---------------------------------------------------------
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ---------------------------------------------------------
      # Check GitHub CLI
      # ---------------------------------------------------------
      - name: Check GitHub CLI
        run: |
          gh --version

      # ---------------------------------------------------------
      # Create Pull Request
      # ---------------------------------------------------------
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GH_PR_TOKEN }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          SOURCE_BRANCH="cluster-staging"
          BASE_BRANCH="main"

          echo "=========================================="
          echo "Repository: ${REPO}"
          echo "Source branch: ${SOURCE_BRANCH}"
          echo "Target branch: ${BASE_BRANCH}"
          echo "=========================================="

          # -----------------------------------------------------
          # Fetch latest branches
          # -----------------------------------------------------
          echo ""
          echo "Fetching branches..."

          git fetch origin "${BASE_BRANCH}"
          git fetch origin "${SOURCE_BRANCH}"

          # -----------------------------------------------------
          # Find changed files
          # -----------------------------------------------------
          echo ""
          echo "Finding changed files..."

          CHANGED_FILES=$(git diff \
            --name-only \
            "origin/${BASE_BRANCH}...origin/${SOURCE_BRANCH}")

          echo ""
          echo "Changed files:"
          echo "${CHANGED_FILES}"

          # -----------------------------------------------------
          # Find cluster folders
          #
          # Example:
          #
          # clusters/
          #   gcp-project4444_sandbox-demo/
          #     gke.tf
          #
          # Extracts:
          #
          # gcp-project4444_sandbox-demo
          # -----------------------------------------------------
          echo ""
          echo "Finding cluster folders..."

          CLUSTER_FOLDERS=$(echo "${CHANGED_FILES}" \
            | grep '^clusters/' \
            | cut -d'/' -f2 \
            | sort -u || true)

          if [ -z "${CLUSTER_FOLDERS}" ]; then
            echo ""
            echo "No cluster folders found."
            exit 0
          fi

          echo ""
          echo "Cluster folders:"
          echo "${CLUSTER_FOLDERS}"

          # -----------------------------------------------------
          # Process each cluster folder
          # -----------------------------------------------------
          for CLUSTER_NAME in ${CLUSTER_FOLDERS}; do

            echo ""
            echo "=========================================="
            echo "Processing cluster: ${CLUSTER_NAME}"
            echo "=========================================="

            SOURCE_PATH="clusters/${CLUSTER_NAME}"
            TARGET_PATH="${CLUSTER_NAME}"
            PR_BRANCH="cluster/${CLUSTER_NAME}"

            echo "Source:"
            echo "  ${SOURCE_PATH}"

            echo "Target:"
            echo "  ${TARGET_PATH}"

            echo "PR branch:"
            echo "  ${PR_BRANCH}"

            # ---------------------------------------------------
            # Check if cluster already exists in main
            # ---------------------------------------------------
            echo ""
            echo "Checking whether cluster already exists in main..."

            if git ls-tree -d "origin/${BASE_BRANCH}" -- "${TARGET_PATH}" \
              | grep -q "${TARGET_PATH}"; then

              echo ""
              echo "Cluster ${TARGET_PATH} already exists in main."
              echo "Skipping this cluster."

              continue
            fi

            # ---------------------------------------------------
            # Create temporary branch from main
            # ---------------------------------------------------
            echo ""
            echo "Creating branch from main..."

            git checkout -B "${PR_BRANCH}" "origin/${BASE_BRANCH}"

            # ---------------------------------------------------
            # Remove any existing target directory
            # ---------------------------------------------------
            rm -rf "${TARGET_PATH}"

            # ---------------------------------------------------
            # Create target directory
            # ---------------------------------------------------
            mkdir -p "${TARGET_PATH}"

            # ---------------------------------------------------
            # Copy cluster files
            #
            # SOURCE:
            #
            # cluster-staging:
            # clusters/<cluster-name>/*
            #
            # DESTINATION:
            #
            # main:
            # <cluster-name>/*
            # ---------------------------------------------------
            echo ""
            echo "Copying cluster files..."

            git archive "origin/${SOURCE_BRANCH}" "${SOURCE_PATH}" \
              | tar -x --strip-components=2 -C "${TARGET_PATH}"

            # ---------------------------------------------------
            # Show copied files
            # ---------------------------------------------------
            echo ""
            echo "Files after copy:"

            find "${TARGET_PATH}" -type f -print

            # ---------------------------------------------------
            # Show Git status
            # ---------------------------------------------------
            echo ""
            echo "Git status:"

            git status --short

            # ---------------------------------------------------
            # Add only the target cluster folder
            # ---------------------------------------------------
            git add "${TARGET_PATH}"

            # ---------------------------------------------------
            # Check if there are changes
            # ---------------------------------------------------
            if git diff --cached --quiet; then

              echo ""
              echo "No changes detected for ${CLUSTER_NAME}."
              continue

            fi

            # ---------------------------------------------------
            # Commit
            # ---------------------------------------------------
            echo ""
            echo "Creating commit..."

            git commit \
              -m "Add GKE cluster ${CLUSTER_NAME}"

            # ---------------------------------------------------
            # Push temporary branch
            # ---------------------------------------------------
            echo ""
            echo "Pushing branch ${PR_BRANCH}..."

            git push \
              --force-with-lease \
              origin "${PR_BRANCH}"

            # ---------------------------------------------------
            # Check existing PR
            # ---------------------------------------------------
            echo ""
            echo "Checking for existing Pull Request..."

            PR_COUNT=$(gh pr list \
              --repo "${REPO}" \
              --head "${PR_BRANCH}" \
              --base "${BASE_BRANCH}" \
              --state open \
              --json number \
              --jq 'length')

            echo "Open PR count: ${PR_COUNT}"

            # ---------------------------------------------------
            # Create PR if one doesn't exist
            # ---------------------------------------------------
            if [ "${PR_COUNT}" -eq 0 ]; then

              echo ""
              echo "Creating Pull Request..."

              PR_URL=$(gh pr create \
                --repo "${REPO}" \
                --head "${PR_BRANCH}" \
                --base "${BASE_BRANCH}" \
                --title "GKE Cluster Portal: ${CLUSTER_NAME}" \
                --body "$(cat <<EOF
          ## GKE Cluster Changes

          This Pull Request was automatically created by the GKE Cluster Portal.

          ### Cluster

          \`${CLUSTER_NAME}\`

          ### Source

          Cluster configuration submitted to:

          \`cluster-staging/clusters/${CLUSTER_NAME}\`

          ### Destination

          The cluster will be added to the root of the repository:

          \`${CLUSTER_NAME}/\`

          ### Flow

          GKE Portal
          ↓
          cluster-staging
          ↓
          cluster/${CLUSTER_NAME}
          ↓
          Pull Request
          ↓
          main

          ### Important

          Only the \`${CLUSTER_NAME}\` cluster folder is included in this Pull Request.

          Other changes in \`cluster-staging\` are not copied to \`main\`.
          EOF
              )")

              echo ""
              echo "=========================================="
              echo "Pull Request created successfully"
              echo "=========================================="
              echo "PR URL: ${PR_URL}"

            else

              echo ""
              echo "=========================================="
              echo "Pull Request already exists"
              echo "=========================================="

              gh pr list \
                --repo "${REPO}" \
                --head "${PR_BRANCH}" \
                --base "${BASE_BRANCH}" \
                --state open \
                --json number,title,url \
                --template '{{range .}}PR #{{.number}}: {{.title}}{{"\n"}}{{.url}}{{"\n"}}{{end}}'

            fi

          done
