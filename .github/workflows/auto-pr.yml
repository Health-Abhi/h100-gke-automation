name: Create Cluster PR

on:
  push:
    branches:
      - cluster-staging
    paths:
      - "clusters/**"

concurrency:
  group: cluster-staging-pr
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create-pr:
    name: Create or Update Cluster PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check GitHub CLI
        run: |
          gh --version

      - name: Create PR for new cluster folder
        env:
          GH_TOKEN: ${{ secrets.GH_PR_TOKEN }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          SOURCE_BRANCH="cluster-staging"
          BASE_BRANCH="main"

          echo "Repository: ${REPO}"
          echo "Source branch: ${SOURCE_BRANCH}"
          echo "Target branch: ${BASE_BRANCH}"

          git fetch origin "${BASE_BRANCH}" "${SOURCE_BRANCH}"

          echo ""
          echo "Finding changed files..."

          CHANGED_FILES=$(git diff \
            --name-only \
            "origin/${BASE_BRANCH}...origin/${SOURCE_BRANCH}")

          echo "Changed files:"
          echo "${CHANGED_FILES}"

          echo ""
          echo "Finding cluster folders..."

          CLUSTER_FOLDERS=$(echo "${CHANGED_FILES}" \
            | grep '^clusters/' \
            | cut -d'/' -f2 \
            | sort -u)

          if [ -z "${CLUSTER_FOLDERS}" ]; then
            echo "No cluster folders found."
            exit 0
          fi

          echo "Cluster folders:"
          echo "${CLUSTER_FOLDERS}"

          for CLUSTER_NAME in ${CLUSTER_FOLDERS}; do

            echo ""
            echo "=========================================="
            echo "Processing cluster: ${CLUSTER_NAME}"
            echo "=========================================="

            SOURCE_PATH="clusters/${CLUSTER_NAME}"
            TARGET_PATH="${CLUSTER_NAME}"

            echo "Source: ${SOURCE_PATH}"
            echo "Target: ${TARGET_PATH}"

            #
            # Check whether this folder already exists in main.
            #
            if git ls-tree -d "origin/${BASE_BRANCH}" -- "${TARGET_PATH}" \
              | grep -q "${TARGET_PATH}"; then

              echo ""
              echo "Folder ${TARGET_PATH} already exists in main."
              echo "Skipping."

              continue
            fi

            #
            # Create a temporary branch from main.
            #
            PR_BRANCH="cluster/${CLUSTER_NAME}"

            echo ""
            echo "Creating branch: ${PR_BRANCH}"

            git checkout -B "${PR_BRANCH}" "origin/${BASE_BRANCH}"

            #
            # Copy ONLY the new cluster folder from
            # cluster-staging into the root of the repository.
            #
            echo ""
            echo "Copying ${SOURCE_PATH} → ${TARGET_PATH}"

            git archive "origin/${SOURCE_BRANCH}:${SOURCE_PATH}" \
              | tar -x

            mkdir -p "${TARGET_PATH}"

            git archive "origin/${SOURCE_BRANCH}:${SOURCE_PATH}" \
              | tar -x -C "${TARGET_PATH}"

            #
            # Show what will be committed.
            #
            echo ""
            echo "Files to be committed:"

            git status --short

            #
            # Commit the new cluster.
            #
            git add "${TARGET_PATH}"

            if git diff --cached --quiet; then
              echo "No changes to commit."
              continue
            fi

            git commit \
              -m "Add GKE cluster ${CLUSTER_NAME}"

            #
            # Push temporary branch.
            #
            echo ""
            echo "Pushing ${PR_BRANCH}..."

            git push \
              --force-with-lease \
              origin "${PR_BRANCH}"

            #
            # Check whether PR already exists.
            #
            PR_COUNT=$(gh pr list \
              --repo "${REPO}" \
              --head "${PR_BRANCH}" \
              --base "${BASE_BRANCH}" \
              --state open \
              --json number \
              --jq 'length')

            echo "Open PR count: ${PR_COUNT}"

            if [ "${PR_COUNT}" -eq 0 ]; then

              echo ""
              echo "Creating Pull Request..."

              PR_URL=$(gh pr create \
                --repo "${REPO}" \
                --head "${PR_BRANCH}" \
                --base "${BASE_BRANCH}" \
                --title "GKE Cluster Portal: ${CLUSTER_NAME}" \
                --body "$(cat <<EOF
          ## GKE Cluster Changes

          This Pull Request was automatically created by the GKE Cluster Portal.

          ### Cluster

          \`${CLUSTER_NAME}\`

          ### Source

          The cluster configuration was submitted through:

          \`cluster-staging/clusters/${CLUSTER_NAME}\`

          ### Destination

          The cluster will be added to the root of the repository:

          \`${CLUSTER_NAME}/\`

          ### Flow

          GKE Portal
          → cluster-staging
          → temporary cluster branch
          → Pull Request
          → main

          Only the new cluster folder is included in this Pull Request.
          EOF
              )")

              echo ""
              echo "=========================================="
              echo "Pull Request created successfully"
              echo "=========================================="
              echo "PR URL: ${PR_URL}"

            else

              echo ""
              echo "=========================================="
              echo "Pull Request already exists."
              echo "=========================================="

              gh pr list \
                --repo "${REPO}" \
                --head "${PR_BRANCH}" \
                --base "${BASE_BRANCH}" \
                --state open \
                --json number,title,url \
                --template '{{range .}}PR #{{.number}}: {{.title}}{{"\n"}}{{.url}}{{"\n"}}{{end}}'

            fi

          done
